# Развёртывание TaskFlow на сервере: Postgres + API + Web.
# Запуск: cp .env.example .env && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      PORT: 3001
      NODE_ENV: production
      APP_SECRET: ${APP_SECRET:-}
      ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-true}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_USERNAME: ${BOT_USERNAME:-}
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-dev-secret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      API_URL: http://api:3001
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-dev-secret}
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Пусто = фронтенд ходит на /api того же домена (nginx-прокси). Настройка не нужна.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
