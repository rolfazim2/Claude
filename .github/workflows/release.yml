name: Build & Publish images (GHCR)

# Собирает Docker-образы api/web/bot и публикует в GitHub Container Registry.
# Образы: ghcr.io/<owner>/taskflow-{api,web,bot}:latest и :<sha>.
on:
  push:
    branches: ['claude/dreamy-babbage-JjQO7', 'main']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, bot]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/taskflow-${{ matrix.app }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/taskflow-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
