<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина — i:Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <h1 class="page-title">Корзина <small id="cart-count-title"></small></h1>
    <div id="cart-root"></div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/app.js"></script>
  <script>
    let promo = null;
    try { promo = JSON.parse(sessionStorage.getItem('promo')); } catch {}

    async function renderCart() {
      const cartItems = Cart.read();
      const root = document.getElementById('cart-root');

      if (!cartItems.length) {
        document.getElementById('cart-count-title').textContent = '';
        root.innerHTML = `<div class="empty">Корзина пуста.<br><br><a class="btn" href="/catalog">Перейти в каталог</a></div>`;
        return;
      }

      const { items: products } = await fetch('/api/products?ids=' + cartItems.map(i => i.id).join(',') + '&limit=60').then(r => r.json());
      const rows = cartItems
        .map(item => ({ ...item, product: products.find(p => p.id === item.id) }))
        .filter(r => r.product);

      const subtotal = rows.reduce((s, r) => s + r.product.price * r.qty, 0);
      const count = rows.reduce((s, r) => s + r.qty, 0);

      // перепроверяем промокод на сервере при каждом изменении суммы
      let discount = 0;
      if (promo) {
        const res = await fetch('/api/promo/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: promo.code, total: subtotal }),
        });
        if (res.ok) {
          promo = await res.json();
          sessionStorage.setItem('promo', JSON.stringify(promo));
          discount = promo.discount;
        } else {
          promo = null;
          sessionStorage.removeItem('promo');
        }
      }

      const deliveryFee = subtotal >= 5000 ? 0 : 490;
      document.getElementById('cart-count-title').textContent =
        `${count} ${plural(count, 'товар', 'товара', 'товаров')}`;

      root.innerHTML = `
        <div class="cart-layout">
          <div>
            ${rows.map(r => `
              <div class="cart-item">
                <a href="/product?id=${r.id}"><img src="${escapeHtml(r.product.image)}" alt=""></a>
                <div>
                  <a class="cart-item-name" href="/product?id=${r.id}">${escapeHtml(r.product.name)}</a>
                  <div style="font-size:13px;color:var(--grey)">${fmt(r.product.price)} / шт.</div>
                </div>
                <div class="qty">
                  <button data-dec="${r.id}">−</button>
                  <span>${r.qty}</span>
                  <button data-inc="${r.id}">+</button>
                </div>
                <span class="price">${fmt(r.product.price * r.qty)}</span>
                <button class="remove" data-remove="${r.id}" title="Удалить">×</button>
              </div>`).join('')}
          </div>
          <aside class="summary">
            <h3>Итого</h3>
            <div class="promo-field">
              <input id="promo-input" placeholder="Промокод" value="${promo ? escapeHtml(promo.code) : ''}">
              <button id="promo-apply">OK</button>
            </div>
            <div class="promo-msg" id="promo-msg">${promo ? `<span class="ok">✓ ${escapeHtml(promo.description || promo.code)}</span>` : ''}</div>
            <div class="summary-row"><span>Товары (${count})</span><span>${fmt(subtotal)}</span></div>
            ${discount ? `<div class="summary-row discount"><span>Скидка по промокоду</span><span>−${fmt(discount)}</span></div>` : ''}
            <div class="summary-row"><span>Доставка</span><span>${deliveryFee ? fmt(deliveryFee) : 'бесплатно'}</span></div>
            <div class="summary-total"><span>К оплате</span><span>${fmt(subtotal - discount + deliveryFee)}</span></div>
            <a class="btn" href="/checkout">Оформить заказ</a>
          </aside>
        </div>`;

      root.onclick = async (e) => {
        const inc = e.target.closest('[data-inc]');
        const dec = e.target.closest('[data-dec]');
        const rem = e.target.closest('[data-remove]');
        if (inc) Cart.setQty(+inc.dataset.inc, Cart.read().find(i => i.id === +inc.dataset.inc).qty + 1);
        if (dec) Cart.setQty(+dec.dataset.dec, Cart.read().find(i => i.id === +dec.dataset.dec).qty - 1);
        if (rem) Cart.remove(+rem.dataset.remove);
        if (inc || dec || rem) return renderCart();

        if (e.target.closest('#promo-apply')) {
          const code = document.getElementById('promo-input').value.trim();
          if (!code) return;
          const res = await fetch('/api/promo/validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, total: subtotal }),
          });
          const data = await res.json();
          if (res.ok) {
            promo = data;
            sessionStorage.setItem('promo', JSON.stringify(data));
            renderCart();
          } else {
            document.getElementById('promo-msg').innerHTML = `<span class="err">${escapeHtml(data.error)}</span>`;
          }
        }
      };
    }

    renderCart();
  </script>
</body>
</html>
