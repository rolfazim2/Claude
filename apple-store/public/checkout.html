<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оформление заказа — i:Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div id="checkout-root">
      <h1 class="page-title">Оформление заказа</h1>
      <div class="cart-layout">
        <form id="checkout-form">
          <div class="form-grid">
            <div class="field"><label>Имя *</label><input name="name" required placeholder="Иван Иванов"></div>
            <div class="field"><label>Телефон *</label><input name="phone" required type="tel" placeholder="+7 (___) ___-__-__"></div>
            <div class="field full"><label>E-mail</label><input name="email" type="email" placeholder="you@example.com"></div>

            <div class="field full">
              <label>Способ получения</label>
              <div class="radio-cards">
                <label class="radio-card"><input type="radio" name="delivery" value="courier" checked>Курьером — от 2 часов</label>
                <label class="radio-card"><input type="radio" name="delivery" value="pickup">Самовывоз — сегодня</label>
              </div>
            </div>

            <div class="field full"><label>Адрес доставки</label><input name="address" placeholder="Город, улица, дом, квартира"></div>

            <div class="field full">
              <label>Оплата</label>
              <div class="radio-cards">
                <label class="radio-card"><input type="radio" name="payment" value="card" checked>Картой онлайн</label>
                <label class="radio-card"><input type="radio" name="payment" value="cash">При получении</label>
              </div>
            </div>

            <div class="field full"><label>Комментарий к заказу</label><textarea name="comment" placeholder="Например: позвонить за час"></textarea></div>
          </div>
          <button class="btn" type="submit" style="margin-top:20px;width:100%">Подтвердить заказ</button>
        </form>

        <aside class="summary">
          <h3>Ваш заказ</h3>
          <div id="order-items"></div>
          <div class="summary-total"><span>Итого</span><span id="order-total"></span></div>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/app.js"></script>
  <script>
    let cartRows = [];

    async function renderSummary() {
      const items = Cart.read();
      if (!items.length) {
        document.getElementById('checkout-root').innerHTML =
          '<div class="empty">Корзина пуста.<br><br><a class="btn" href="/catalog">Перейти в каталог</a></div>';
        return;
      }
      const products = await Promise.all(items.map(i =>
        fetch('/api/products/' + i.id).then(r => r.ok ? r.json() : null)));
      cartRows = items.map((item, idx) => ({ ...item, product: products[idx] })).filter(r => r.product);

      document.getElementById('order-items').innerHTML = cartRows.map(r =>
        `<div class="summary-row"><span>${escapeHtml(r.product.name)} × ${r.qty}</span><span>${fmt(r.product.price * r.qty)}</span></div>`).join('');
      document.getElementById('order-total').textContent =
        fmt(cartRows.reduce((s, r) => s + r.product.price * r.qty, 0));
    }

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer: Object.fromEntries(form),
          items: Cart.read(),
        }),
      });
      const data = await res.json();
      if (!res.ok) return toast(data.error || 'Ошибка оформления');

      Cart.clear();
      document.getElementById('checkout-root').innerHTML = `
        <div class="order-done">
          <div class="check">✓</div>
          <h1>Заказ №${data.id} оформлен!</h1>
          <p>Сумма заказа: <b>${fmt(data.total)}</b>.<br>Мы свяжемся с вами в ближайшее время для подтверждения.</p>
          <a class="btn" href="/catalog">Продолжить покупки</a>
        </div>`;
    });

    renderSummary();
  </script>
</body>
</html>
