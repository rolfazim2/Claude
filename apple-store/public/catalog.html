<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — i:Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="breadcrumbs"><a href="/">Главная</a> / <span id="bc">Каталог</span></div>

    <div class="catalog-toolbar">
      <h1 id="cat-title">Каталог <small id="cat-count"></small></h1>
      <select id="sort">
        <option value="">Сначала популярные</option>
        <option value="price_asc">Сначала дешевле</option>
        <option value="price_desc">Сначала дороже</option>
        <option value="rating">По рейтингу</option>
        <option value="new">Новинки</option>
        <option value="name">По названию</option>
      </select>
    </div>

    <div class="chips" id="chips"></div>

    <div class="catalog-layout">
      <aside class="filters">
        <h3>Фильтры</h3>
        <div class="filter-group">
          <b>Цена, ₽</b>
          <div class="price-inputs">
            <input type="number" id="minPrice" placeholder="от" min="0">
            <span>—</span>
            <input type="number" id="maxPrice" placeholder="до" min="0">
          </div>
        </div>
        <div class="filter-group">
          <label><input type="checkbox" id="inStock"> Только в наличии</label>
          <label><input type="checkbox" id="sale"> Со скидкой</label>
        </div>
        <button class="btn" id="apply" style="width:100%">Применить</button>
        <button class="btn btn-outline" id="reset" style="width:100%;margin-top:10px">Сбросить</button>
      </aside>

      <section>
        <div class="grid" id="products"></div>
        <div class="empty" id="empty" hidden>По вашему запросу ничего не найдено</div>
        <div class="pagination" id="pagination"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/app.js"></script>
  <script src="/js/catalog.js"></script>
</body>
</html>
